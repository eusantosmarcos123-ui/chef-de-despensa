<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chef de Despensa — Protótipo Interativo Google Stitch</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .device-shadow {
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.3), 0 0 0 12px #1f2937, 0 0 0 14px #374151;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 md:p-8">

  <!-- Header Controls -->
  <header class="w-full max-w-5xl flex flex-col md:flex-row items-center justify-between gap-4 pb-6 border-b border-slate-800">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center text-2xl shadow-lg shadow-emerald-500/10">
        🍲
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-xl font-bold text-white">Chef de Despensa</h1>
          <span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
            Google Stitch AI
          </span>
        </div>
        <p class="text-xs text-slate-400">Zero Desperdício Alimentar • Protótipo Interativo em Alta Fidelidade</p>
      </div>
    </div>

    <!-- Screen Switcher Tabs -->
    <nav class="flex items-center bg-slate-800/80 p-1.5 rounded-2xl border border-slate-700/60 shadow-inner">
      <button onclick="setScreen('screens/01_dashboard_despensa.html', this)" class="nav-tab active-tab flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold transition-all bg-emerald-500 text-white shadow-md">
        <span class="material-symbols-outlined text-[18px]">kitchen</span>
        <span>1. Despensa</span>
      </button>
      <button onclick="setScreen('screens/02_cadastro_ingrediente.html', this)" class="nav-tab flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold transition-all text-slate-400 hover:text-white hover:bg-slate-700/50">
        <span class="material-symbols-outlined text-[18px]">add_circle</span>
        <span>2. Cadastro</span>
      </button>
      <button onclick="setScreen('screens/03_sugestoes_receitas.html', this)" class="nav-tab flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold transition-all text-slate-400 hover:text-white hover:bg-slate-700/50">
        <span class="material-symbols-outlined text-[18px]">restaurant_menu</span>
        <span>3. Receitas</span>
      </button>
    </nav>
  </header>

  <!-- Interactive Mockup Canvas -->
  <main class="my-8 flex flex-col items-center justify-center">
    <!-- Smartphone Frame -->
    <div class="relative w-[380px] sm:w-[412px] h-[830px] bg-black rounded-[48px] overflow-hidden device-shadow flex flex-col">
      <!-- Dynamic Island / Speaker notch -->
      <div class="absolute top-0 left-0 right-0 h-7 z-50 flex items-center justify-center pointer-events-none">
        <div class="w-28 h-5 bg-black rounded-full mt-1.5 flex items-center justify-center">
          <div class="w-3 h-3 rounded-full bg-slate-900 border border-slate-800 mr-2"></div>
          <div class="w-2 h-2 rounded-full bg-slate-950"></div>
        </div>
      </div>

      <!-- Iframe Displaying Stitch Generated Screen -->
      <iframe id="screen-frame" src="screens/01_dashboard_despensa.html" class="w-full h-full border-0 bg-[#F9FAFB]"></iframe>
    </div>

    <!-- Quick Open Button -->
    <div class="mt-4 flex items-center gap-4 text-xs text-slate-400">
      <a id="direct-link" href="screens/01_dashboard_despensa.html" target="_blank" class="inline-flex items-center gap-1 hover:text-emerald-400 transition-colors">
        <span class="material-symbols-outlined text-[16px]">open_in_new</span>
        <span>Abrir esta tela em aba inteira</span>
      </a>
      <span>•</span>
      <span class="text-slate-500">Renderizado com Tailwind CSS & Material Design 3</span>
    </div>
  </main>

  <!-- Footer Navigation / Cloud Stitch Link -->
  <footer class="w-full max-w-5xl flex flex-col sm:flex-row items-center justify-between gap-3 pt-6 border-t border-slate-800 text-xs text-slate-400">
    <div class="flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
      <span>Sincronizado com <strong>Google Antigravity</strong> & <strong>Google Stitch</strong></span>
    </div>
    <div class="flex items-center gap-4">
      <a href="https://stitch.withgoogle.com" target="_blank" class="hover:text-emerald-400 transition-colors flex items-center gap-1">
        <span class="material-symbols-outlined text-[16px]">cloud</span>
        <span>Google Stitch Web</span>
      </a>
    </div>
  </footer>

  <script>
    function setScreen(url, btn) {
      document.getElementById('screen-frame').src = url;
      document.getElementById('direct-link').href = url;

      document.querySelectorAll('.nav-tab').forEach(t => {
        t.className = 'nav-tab flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold transition-all text-slate-400 hover:text-white hover:bg-slate-700/50';
      });

      btn.className = 'nav-tab active-tab flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold transition-all bg-emerald-500 text-white shadow-md';
    }
  </script>
</body>
</html>
